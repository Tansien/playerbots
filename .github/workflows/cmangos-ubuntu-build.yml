name: Ubuntu Build

# CI policy for this fork:
# - All jobs run on self-hosted Ubuntu 26.04 runners only, pinned to this
#   repository's runner pool (labels: [self-hosted, linux, playerbots]).
#   No GitHub-hosted runners and no macOS/Windows jobs. If no self-hosted runner is
#   online, jobs stay queued; do not switch back to GitHub-hosted runners.
# - Trust boundary: the persistent self-hosted runners execute trusted refs only.
#   Triggers are push (branches of this repository; writers only) and manual
#   workflow_dispatch — there is deliberately NO pull_request trigger, because a
#   pull_request run executes the PR's own copy of this workflow, which a fork can
#   edit. Same-repo PRs still get checks via the push run on their head commit.
#   Fork PRs get no automatic CI: review the diff (including workflow changes!)
#   first, then run it from a trusted branch or workflow_dispatch. Keep the Actions
#   fork-approval policy at "all external contributors" and prefer ephemeral/JIT
#   runner registration as additional layers.
# - No Discord (or any other) notification steps.
# - Build state: each job configures and builds under RUNNER_TEMP, which the runner
#   recreates per job, so no CMake cache or artifact survives between runs.
# - Runners are provisioned by the repository owner and are expected to provide the
#   normal CMaNGOS build dependencies: git, cmake (>= 3.20), g++ or clang++,
#   libboost-all-dev, libssl-dev, libmysqlclient-dev/default-libmysqlclient-dev, and
#   libicu-dev (on 26.04 the mysql client library links ICU, so the dev package is
#   required at link time). The 3.20 floor is set by `ctest --test-dir` in the
#   Test steps below; CMakeLists.txt asks only for 3.16 because that is all the
#   CMake source needs, and it is evaluated only on a standalone configure.

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: Release

jobs:
  living-tests:
    name: Living Realm host tests
    runs-on: [self-hosted, linux, playerbots]

    steps:
      - name: Runner preflight (require Ubuntu 26.04)
        run: |
          if [ ! -r /etc/os-release ]; then
            echo "::error::/etc/os-release not readable; this workflow only supports Ubuntu Linux runners"
            exit 1
          fi
          . /etc/os-release
          if [ "${ID}" != "ubuntu" ] || [ "${VERSION_ID}" != "26.04" ]; then
            echo "::error::Self-hosted runner must be Ubuntu 26.04, got: ${PRETTY_NAME:-${ID} ${VERSION_ID}}"
            exit 1
          fi
          echo "Runner OS: ${PRETTY_NAME}"

      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Configure
        run: cmake -DBUILD_PLAYERBOTS_LIVING_TESTS=ON -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -B "$RUNNER_TEMP/build-living" -S .

      - name: Build
        run: cmake --build "$RUNNER_TEMP/build-living" -j "$(nproc)"

      - name: Test
        # --no-tests=error: ctest exits 0 when NO tests are registered, so a suite
        # that silently stops registering would otherwise report a green build.
        run: ctest --test-dir "$RUNNER_TEMP/build-living" --output-on-failure --no-tests=error

  build:
    name: Build ${{ matrix.version }}
    runs-on: [self-hosted, linux, playerbots]

    strategy:
      fail-fast: false
      matrix:
        # Pinned CMaNGOS core baselines from docs/design/0001-living-realm-implementation-contract.md (A.1).
        include:
          - version: classic
            core_ref: de8f72993b9e1faa1bf92dd5505f3daec5cea3ce
          - version: tbc
            core_ref: e107b53c175e47d7e5b3496181353f5a6349be43
          - version: wotlk
            core_ref: 57a34d33fb8cb1822258c690c583cc9be8d04708

    steps:
      - name: Runner preflight (require Ubuntu 26.04)
        run: |
          if [ ! -r /etc/os-release ]; then
            echo "::error::/etc/os-release not readable; this workflow only supports Ubuntu Linux runners"
            exit 1
          fi
          . /etc/os-release
          if [ "${ID}" != "ubuntu" ] || [ "${VERSION_ID}" != "26.04" ]; then
            echo "::error::Self-hosted runner must be Ubuntu 26.04, got: ${PRETTY_NAME:-${ID} ${VERSION_ID}}"
            exit 1
          fi
          echo "Runner OS: ${PRETTY_NAME}"

      - name: Checkout CMaNGOS ${{ matrix.version }} core
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: cmangos/mangos-${{ matrix.version }}
          ref: ${{ matrix.core_ref }}
          path: core

      - name: Checkout playerbots
        # Must live inside the core tree (the core adds it via add_subdirectory);
        # checked out after the core so the core checkout cannot wipe it.
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          path: core/src/modules/PlayerBots

      - name: Configure
        # FETCHCONTENT_SOURCE_DIR_PLAYERBOTS pins the module to this checkout;
        # without it FetchContent would update the directory to upstream master.
        # Build/install dirs live under RUNNER_TEMP so nothing is reused across runs.
        run: >
          cmake
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
          -DBUILD_PLAYERBOTS=ON
          -DFETCHCONTENT_SOURCE_DIR_PLAYERBOTS="${GITHUB_WORKSPACE}/core/src/modules/PlayerBots"
          -DCMAKE_INSTALL_PREFIX="${RUNNER_TEMP}/run-${{ matrix.version }}"
          -B "${RUNNER_TEMP}/build-${{ matrix.version }}"
          -S core

      - name: Build
        run: cmake --build "${RUNNER_TEMP}/build-${{ matrix.version }}" -j "$(nproc)"

      - name: Install
        # Validates the install rules (binaries plus the configured
        # aiplayerbot.conf.dist) like the pre-fork workflow did.
        run: cmake --install "${RUNNER_TEMP}/build-${{ matrix.version }}"
