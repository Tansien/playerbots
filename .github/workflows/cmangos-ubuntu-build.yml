name: Ubuntu Build

# This workflow is the only thing that compiles the module (-DBUILD_PLAYERBOTS=ON),
# so it must run on pull requests too. Without the pull_request trigger a PR that
# does not compile against any core still shows a green check.
#
# Safe on fork PRs because every job runs on GitHub-hosted ephemeral runners: a
# fork PR gets a fresh throwaway VM, a read-only token and no repository secrets,
# so the worst a malicious PR can do is waste its own build minutes. Do not move
# these jobs to persistent self-hosted runners while pull_request is a trigger --
# a pull_request run executes the PR's own copy of this workflow, which a fork can
# edit.
on:
  push:
  pull_request:

# Same-repo pull requests fire both triggers on the same commit. Grouping by ref
# keeps that from paying for two identical three-core builds.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release
  REPO_DIR : ${{github.workspace}}
  BUILD_DIR: ${{github.workspace}}/bin/builddir
  BOOST_VERSION: "1.83.0"
  BOOST_PLATFORM_VERSION: "22.04"
  COMPILER_CC: clang
  COMPILER_PP: clang++
  CORE_REPO_OWNER: ${{github.repository_owner}}

jobs:
  build:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    strategy:
      matrix:
        version: [classic, tbc, wotlk]
        include:
          - os: ubuntu-22.04
            EXTRA_BUILD: "-DBUILD_PLAYERBOTS=ON"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: ${{github.repository_owner}}/mangos-${{matrix.version}}
          ref: master
          path: ${{env.REPO_DIR}}

      - name: Create Build Environment
        run: |
          echo "GITHUB_SHORT_REV=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "ARCHIVE_FILENAME=${{ github.event.repository.name }}-$(git rev-parse --short HEAD).zip" >> $GITHUB_ENV
          echo "CC=${{env.COMPILER_CC}}" >> $GITHUB_ENV
          echo "CXX=${{env.COMPILER_PP}}" >> $GITHUB_ENV
          cmake -E make_directory ${{ env.BUILD_DIR }}

      - name: Install Boost
        uses: MarkusJx/install-boost@v2.4.5
        id: install-boost
        with:
          # REQUIRED: Specify the required boost version
          # A list of supported versions can be found here:
          # https://github.com/MarkusJx/prebuilt-boost/blob/main/versions-manifest.json
          boost_version: ${{env.BOOST_VERSION}}
          # OPTIONAL: Specify a platform version
          platform_version: ${{env.BOOST_PLATFORM_VERSION}}
          # OPTIONAL: Specify a toolset
          toolset: gcc
          # OPTIONAL: Specify an architecture
          arch: x86
          # NOTE: If a boost version matching all requirements cannot be found,
          # this build step will fail

      - name: Configure
        env:
          BOOST_ROOT: ${{ steps.install-boost.outputs.BOOST_ROOT }}
        run: cmake -DBoost_ARCHITECTURE=-x64 -DCMAKE_INSTALL_PREFIX=/home/runner/work ${{matrix.EXTRA_BUILD}} -B ${{env.BUILD_DIR}} -S ${{env.REPO_DIR}}

      - name: Build
        env:
          MAKEFLAGS: "-j8"
        run: |
            cmake --build ${{env.BUILD_DIR}} --config ${{env.BUILD_TYPE}}
            cmake --install ${{env.BUILD_DIR}}

  notify:
    name: Send Notification to Discord on Failure
    runs-on: ubuntu-22.04
    permissions:
      contents: none
    needs: # make sure the notification is sent AFTER the jobs you want included have completed
      - build
    # push only: secrets.DISCORD_WEBHOOK is not exposed to fork pull requests, and
    # github.event.pusher / head_commit are push-event fields that are empty on a
    # pull_request run -- so on a failing fork PR this job would post nothing and
    # just add a second, confusing red check.
    if: failure() && github.event_name == 'push'

    steps:
      - name: Setup Environmental Variables
        run: |
          echo "GIT_BRANCH=${GITHUB_REF#refs/heads/}" >> $GITHUB_ENV
          echo "GIT_SHORT_SHA=`echo ${GITHUB_SHA} | cut -c1-8`" >> $GITHUB_ENV

      - name: Notify
        uses: rjstone/discord-webhook-notify@v1.1.1
        with:
          severity: error
          description: |
            **Linux Build Failed**
          details: |
            - **Branch:** ${{env.GIT_BRANCH}}
            - **Pusher:** ${{github.event.pusher.name}}
            - **Author:** ${{github.event.head_commit.author.name}}
            - **Commit:** [${{github.repository}}/${{env.GIT_SHORT_SHA}}](${{github.server_url}}/${{ github.repository }}/commit/${{github.sha}})
            - **Build Log:** [actions/runs/${{github.run_id}}](${{github.server_url}}/${{github.repository}}/actions/runs/${{github.run_id}})
          footer: CMaNGOS Developers Notified!
          webhookUrl: ${{ secrets.DISCORD_WEBHOOK }}
