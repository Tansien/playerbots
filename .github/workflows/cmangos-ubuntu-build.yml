name: Ubuntu Build

# CI policy for this fork:
# - All jobs run on self-hosted Ubuntu Linux runners only (labels: [self-hosted, linux]).
#   No GitHub-hosted runners and no macOS/Windows jobs. If no self-hosted runner is
#   online, jobs stay queued; do not switch back to GitHub-hosted runners.
# - No Discord (or any other) notification steps.
# - Fork pull requests must not execute code on the self-hosted runners; every job
#   carries a head-repository guard and the workflow uses pull_request (never
#   pull_request_target).
# - Runners are provisioned by the repository owner and are expected to provide the
#   normal CMaNGOS build dependencies: git, cmake (>= 3.16), g++ or clang++,
#   libboost-all-dev, libssl-dev, and libmysqlclient-dev/default-libmysqlclient-dev.

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: Release

jobs:
  living-tests:
    name: Living Realm host tests
    # Never run automatically for fork pull requests: they must not execute code on
    # the self-hosted runners.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux]

    steps:
      - name: Runner preflight (require Ubuntu)
        run: |
          if [ ! -r /etc/os-release ]; then
            echo "::error::/etc/os-release not readable; this workflow only supports Ubuntu Linux runners"
            exit 1
          fi
          . /etc/os-release
          if [ "${ID}" != "ubuntu" ]; then
            echo "::error::Self-hosted runner must be Ubuntu Linux, got: ${PRETTY_NAME:-${ID}}"
            exit 1
          fi
          echo "Runner OS: ${PRETTY_NAME}"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -DBUILD_PLAYERBOTS_LIVING_TESTS=ON -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -B build-living -S .

      - name: Build
        run: cmake --build build-living -j "$(nproc)"

      - name: Test
        run: ctest --test-dir build-living --output-on-failure

  build:
    name: Build ${{ matrix.version }}
    # Never run automatically for fork pull requests: they must not execute code on
    # the self-hosted runners.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux]

    strategy:
      fail-fast: false
      matrix:
        # Pinned CMaNGOS core baselines from docs/design/0001-living-realm-implementation-contract.md (A.1).
        include:
          - version: classic
            core_ref: de8f72993b9e1faa1bf92dd5505f3daec5cea3ce
          - version: tbc
            core_ref: e107b53c175e47d7e5b3496181353f5a6349be43
          - version: wotlk
            core_ref: 57a34d33fb8cb1822258c690c583cc9be8d04708

    steps:
      - name: Runner preflight (require Ubuntu)
        run: |
          if [ ! -r /etc/os-release ]; then
            echo "::error::/etc/os-release not readable; this workflow only supports Ubuntu Linux runners"
            exit 1
          fi
          . /etc/os-release
          if [ "${ID}" != "ubuntu" ]; then
            echo "::error::Self-hosted runner must be Ubuntu Linux, got: ${PRETTY_NAME:-${ID}}"
            exit 1
          fi
          echo "Runner OS: ${PRETTY_NAME}"

      - name: Checkout CMaNGOS ${{ matrix.version }} core
        uses: actions/checkout@v4
        with:
          repository: cmangos/mangos-${{ matrix.version }}
          ref: ${{ matrix.core_ref }}
          path: core

      - name: Checkout playerbots
        # Must live inside the core tree (the core adds it via add_subdirectory);
        # checked out after the core so the core checkout cannot wipe it.
        uses: actions/checkout@v4
        with:
          path: core/src/modules/PlayerBots

      - name: Configure
        # FETCHCONTENT_SOURCE_DIR_PLAYERBOTS pins the module to this checkout;
        # without it FetchContent would update the directory to upstream master.
        run: >
          cmake
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
          -DBUILD_PLAYERBOTS=ON
          -DFETCHCONTENT_SOURCE_DIR_PLAYERBOTS="${GITHUB_WORKSPACE}/core/src/modules/PlayerBots"
          -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}/run"
          -B build
          -S core

      - name: Build
        run: cmake --build build -j "$(nproc)"
