name: Ubuntu Build

# This workflow is the only thing that compiles the module (-DBUILD_PLAYERBOTS=ON),
# so it must run on pull requests too. Without the pull_request trigger a PR that
# does not compile against any core still shows a green check.
#
# Safe on fork PRs because every job runs on GitHub-hosted ephemeral runners: a
# fork PR gets a fresh throwaway VM, a read-only token and no repository secrets,
# so the worst a malicious PR can do is waste its own build minutes. Do not move
# these jobs to persistent self-hosted runners while pull_request is a trigger --
# a pull_request run executes the PR's own copy of this workflow, which a fork can
# edit.
on:
  # push is limited to master so a branch that has an open PR is not built twice
  # (a same-repo PR would otherwise fire push and pull_request on the same commit,
  # and the two events do not share a concurrency group key). Feature branches are
  # covered by their pull request; master is covered on merge.
  push:
    branches:
      - master
  pull_request:
  # Lets a maintainer validate a branch with no open PR, or re-run after a core
  # pin bump / infrastructure fix, without pushing an empty commit.
  workflow_dispatch:

# Read-only is the floor for anything added to this file later.
permissions:
  contents: read

concurrency:
  # Keyed on the PR number, not github.head_ref: two PRs from different forks
  # that share a branch name (patch-1, master, dev) would otherwise collide and
  # cancel each other, producing a red check unrelated to the PR's own code.
  # PR runs share a group (per PR number) so a new push supersedes the old run.
  # Everything else falls back to github.run_id, which is unique per run, so each
  # master push gets its own group: grouping them on github.ref would let a third
  # push evict the queued second one even with cancel-in-progress false, leaving
  # an intermediate merge commit permanently unvalidated.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  # Only collapse redundant PR runs. Cancelling a push build would leave a merge
  # commit on master permanently unvalidated when two PRs merge back to back.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release
  BUILD_DIR: ${{github.workspace}}/bin/builddir
  BOOST_VERSION: "1.83.0"
  BOOST_PLATFORM_VERSION: "22.04"
  COMPILER_CC: clang
  COMPILER_PP: clang++
  # The core lives upstream. This was ${{github.repository_owner}}, which on any
  # fork resolves to the fork owner and checks out a repository that does not
  # exist -- so every build job failed at checkout with "Repository not found".
  CORE_REPO_OWNER: cmangos

jobs:
  build:
    # Explicit name: an include-only matrix names jobs from EVERY key, so this
    # would otherwise render as "build (classic, de8f7299...)" and every core-ref
    # bump would rename the check, breaking any branch-protection rule requiring it.
    name: build (${{ matrix.version }})
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        # Core refs are PINNED. Tracking cmangos master makes this workflow break
        # on any upstream API change with no commit of ours involved -- and it is
        # already broken that way today: against current mangos-tbc master,
        # BankAction.cpp fails with "too few arguments to function call, expected
        # at least 6, have 5". Bump these deliberately, in their own commit, so an
        # upstream break is never confused with a regression in a pull request.
        include:
          - version: classic
            core_ref: de8f72993b9e1faa1bf92dd5505f3daec5cea3ce
          - version: tbc
            core_ref: e107b53c175e47d7e5b3496181353f5a6349be43
          - version: wotlk
            core_ref: 57a34d33fb8cb1822258c690c583cc9be8d04708

    env:
      EXTRA_BUILD: "-DBUILD_PLAYERBOTS=ON"

    steps:
      - name: Checkout CMaNGOS ${{matrix.version}} core
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
        with:
          repository: ${{env.CORE_REPO_OWNER}}/mangos-${{matrix.version}}
          ref: ${{matrix.core_ref}}
          path: core
          persist-credentials: false

      - name: Checkout playerbots
        # Must live inside the core tree (the core adds it via add_subdirectory),
        # and must be checked out AFTER the core so the core checkout cannot wipe
        # it. Without this the job builds whatever FetchContent pulls from
        # upstream -- i.e. not the code under review.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
        with:
          path: core/src/modules/PlayerBots
          persist-credentials: false

      - name: Create Build Environment
        run: |
          echo "CC=${{env.COMPILER_CC}}" >> $GITHUB_ENV
          echo "CXX=${{env.COMPILER_PP}}" >> $GITHUB_ENV
          cmake -E make_directory ${{ env.BUILD_DIR }}

      - name: Install Boost
        uses: MarkusJx/install-boost@51b5604fed63e1e8f76d4b564002e9e7cdcce63a # v2.4.5
        id: install-boost
        with:
          # REQUIRED: Specify the required boost version
          # A list of supported versions can be found here:
          # https://github.com/MarkusJx/prebuilt-boost/blob/main/versions-manifest.json
          boost_version: ${{env.BOOST_VERSION}}
          # OPTIONAL: Specify a platform version
          platform_version: ${{env.BOOST_PLATFORM_VERSION}}
          # OPTIONAL: Specify a toolset
          toolset: gcc
          # OPTIONAL: Specify an architecture
          arch: x86
          # NOTE: If a boost version matching all requirements cannot be found,
          # this build step will fail

      - name: Configure
        env:
          BOOST_ROOT: ${{ steps.install-boost.outputs.BOOST_ROOT }}
        # FETCHCONTENT_SOURCE_DIR_PLAYERBOTS pins the module to the checkout above;
        # without it FetchContent replaces it with upstream master and the build
        # silently tests the wrong code.
        run: >
          cmake
          -DBoost_ARCHITECTURE=-x64
          -DCMAKE_INSTALL_PREFIX=/home/runner/work
          ${{env.EXTRA_BUILD}}
          -DFETCHCONTENT_SOURCE_DIR_PLAYERBOTS="${{github.workspace}}/core/src/modules/PlayerBots"
          -B ${{env.BUILD_DIR}}
          -S ${{github.workspace}}/core

      # The whole value of this workflow is that a green check means THIS commit
      # compiled. The core declares PlayerBots via FetchContent with
      # GIT_TAG master, so if FETCHCONTENT_SOURCE_DIR_PLAYERBOTS is ever dropped,
      # typo'd or renamed upstream, the update step silently repoints the tree at
      # cmangos/playerbots master and the job goes green having built the wrong
      # code. Assert the tree is still ours before spending time compiling it.
      - name: Verify the module under test is this checkout
        shell: bash
        run: |
          expected="${{github.sha}}"
          actual="$(git -C "${{github.workspace}}/core/src/modules/PlayerBots" rev-parse HEAD)"
          echo "expected $expected"
          echo "actual   $actual"
          if [ "$actual" != "$expected" ]; then
            echo "::error::Module tree is not the commit under test - FetchContent replaced it."
            git -C "${{github.workspace}}/core/src/modules/PlayerBots" remote -v
            exit 1
          fi

      - name: Build
        env:
          MAKEFLAGS: "-j8"
        run: |
            cmake --build ${{env.BUILD_DIR}} --config ${{env.BUILD_TYPE}}
            cmake --install ${{env.BUILD_DIR}}
