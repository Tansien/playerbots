name: Ubuntu Build

# CI policy for this fork:
# - All jobs run on self-hosted Ubuntu 26.04 runners only, pinned to this
#   repository's runner pool (labels: [self-hosted, linux, playerbots]).
#   No GitHub-hosted runners and no macOS/Windows jobs. If no self-hosted runner is
#   online, jobs stay queued; do not switch back to GitHub-hosted runners.
# - Trust boundary: the persistent self-hosted runners execute trusted refs only.
#   Triggers are push (master), pull_request and manual workflow_dispatch. The
#   pull_request trigger is gated by a job-level `if` to SAME-REPOSITORY pull
#   requests, because a pull_request run executes the PR's own copy of this
#   workflow, which a fork can edit -- a fork PR must never reach these runners.
#   Fork PRs are therefore skipped, not failed: review the diff (including
#   workflow changes!) first, then validate it with workflow_dispatch. Keep the
#   Actions fork-approval policy at "all external contributors" and prefer
#   ephemeral/JIT runner registration as additional layers.
# - The build job is the ONLY thing that compiles the module (-DBUILD_PLAYERBOTS=ON).
#   Before this trigger existed, a pull request ran no check that compiled a single
#   line of it, so a PR that did not build still showed a green check.
# - Core refs are PINNED. Tracking cmangos master breaks this workflow on any
#   upstream API change with no commit of ours involved -- and it does today:
#   against current mangos-tbc master, BankAction.cpp fails with "too few
#   arguments to function call, expected at least 6, have 5". Bump the pins
#   deliberately, in their own commit, so upstream drift is never mistaken for a
#   regression in a pull request.
# - No Discord (or any other) notification steps.
# - Build state: each job configures and builds under RUNNER_TEMP, which the runner
#   recreates per job, so no CMake cache or artifact survives between runs.
# - Runners are provisioned by the repository owner and are expected to provide the
#   normal CMaNGOS build dependencies: git, cmake (>= 3.16), g++ or clang++,
#   libboost-all-dev, libssl-dev, libmysqlclient-dev/default-libmysqlclient-dev, and
#   libicu-dev (on 26.04 the mysql client library links ICU, so the dev package is
#   required at link time).

on:
  push:
    branches:
      - master
  # Same-repo pull requests only -- see the job-level `if`. Without this trigger
  # nothing compiled the module on a PR at all, which is the gap this closes.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PR runs group per PR number so a new push supersedes the old run. Everything
  # else falls back to github.run_id (unique per run) so each master push keeps
  # its own group: grouping them on github.ref would let a third push evict the
  # queued second one, leaving an intermediate merge commit unvalidated.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BUILD_TYPE: Release

jobs:
  living-tests:
    name: Living Realm host tests (${{ matrix.lane }})
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, playerbots]

    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: release
            cmake_args: "-DCMAKE_BUILD_TYPE=Release"
          - lane: asan-ubsan
            # -fno-sanitize-recover=undefined makes a UBSan finding fail the job
            # rather than print and continue. The suite is pure computation, so
            # this costs seconds and catches the overflow/OOB class this module
            # has shipped before.
            cmake_args: >-
              -DCMAKE_BUILD_TYPE=Debug
              -DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined
              -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined

    steps:
      - name: Runner preflight (require Ubuntu 26.04)
        run: |
          if [ ! -r /etc/os-release ]; then
            echo "::error::/etc/os-release not readable; this workflow only supports Ubuntu Linux runners"
            exit 1
          fi
          . /etc/os-release
          if [ "${ID}" != "ubuntu" ] || [ "${VERSION_ID}" != "26.04" ]; then
            echo "::error::Self-hosted runner must be Ubuntu 26.04, got: ${PRETTY_NAME:-${ID} ${VERSION_ID}}"
            exit 1
          fi
          echo "Runner OS: ${PRETTY_NAME}"

      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Configure
        run: cmake -DBUILD_PLAYERBOTS_LIVING_TESTS=ON ${{ matrix.cmake_args }} -B "$RUNNER_TEMP/build-living-${{ matrix.lane }}" -S .

      - name: Build
        run: cmake --build "$RUNNER_TEMP/build-living-${{ matrix.lane }}" -j "$(nproc)"

      - name: Test
        # --no-tests=error: ctest exits 0 when NO tests are registered, so a suite
        # that silently stopped registering would otherwise report a green build.
        env:
          # LeakSanitizer is off deliberately: this configuration was validated
          # without it, so enabling it here would gate every PR on a check that
          # has never run green. Turn it on in its own change once the suite is
          # confirmed leak-clean on Linux.
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1
        run: ctest --test-dir "$RUNNER_TEMP/build-living-${{ matrix.lane }}" --output-on-failure --no-tests=error

  build:
    # Named from matrix.version only: an include-only matrix otherwise names jobs
    # from EVERY key, rendering as "Build (classic, de8f7299...)", so each core-ref
    # bump would rename the check and break any branch-protection rule needing it.
    name: Build ${{ matrix.version }}
    # A pull_request run executes the PR's OWN copy of this workflow, which a
    # fork can edit -- that is why fork PRs must never reach these persistent
    # runners. Same-repo PRs are trusted (writers only). Review a fork PR's diff,
    # including this file, then validate it with workflow_dispatch.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, playerbots]

    strategy:
      fail-fast: false
      matrix:
        # Pinned CMaNGOS core baselines from docs/design/0001-living-realm-implementation-contract.md (A.1).
        include:
          - version: classic
            core_ref: de8f72993b9e1faa1bf92dd5505f3daec5cea3ce
          - version: tbc
            core_ref: e107b53c175e47d7e5b3496181353f5a6349be43
          - version: wotlk
            core_ref: 57a34d33fb8cb1822258c690c583cc9be8d04708

    steps:
      - name: Runner preflight (require Ubuntu 26.04)
        run: |
          if [ ! -r /etc/os-release ]; then
            echo "::error::/etc/os-release not readable; this workflow only supports Ubuntu Linux runners"
            exit 1
          fi
          . /etc/os-release
          if [ "${ID}" != "ubuntu" ] || [ "${VERSION_ID}" != "26.04" ]; then
            echo "::error::Self-hosted runner must be Ubuntu 26.04, got: ${PRETTY_NAME:-${ID} ${VERSION_ID}}"
            exit 1
          fi
          echo "Runner OS: ${PRETTY_NAME}"

      - name: Checkout CMaNGOS ${{ matrix.version }} core
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: cmangos/mangos-${{ matrix.version }}
          ref: ${{ matrix.core_ref }}
          path: core
          persist-credentials: false

      - name: Checkout playerbots
        # Must live inside the core tree (the core adds it via add_subdirectory);
        # checked out after the core so the core checkout cannot wipe it.
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          path: core/src/modules/PlayerBots
          persist-credentials: false

      - name: Configure
        # FETCHCONTENT_SOURCE_DIR_PLAYERBOTS pins the module to this checkout;
        # without it FetchContent would update the directory to upstream master.
        # Build/install dirs live under RUNNER_TEMP so nothing is reused across runs.
        run: >
          cmake
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
          -DBUILD_PLAYERBOTS=ON
          -DFETCHCONTENT_SOURCE_DIR_PLAYERBOTS="${GITHUB_WORKSPACE}/core/src/modules/PlayerBots"
          -DCMAKE_INSTALL_PREFIX="${RUNNER_TEMP}/run-${{ matrix.version }}"
          -B "${RUNNER_TEMP}/build-${{ matrix.version }}"
          -S core

      # A green check must mean THIS commit compiled. The core declares PlayerBots
      # via FetchContent with GIT_TAG master, so if the source-dir override is ever
      # dropped, typo'd or renamed upstream, the update step silently repoints the
      # tree at cmangos/playerbots master and the job goes green having built the
      # wrong code. Assert before spending a full core build on it.
      - name: Verify the module under test is this checkout
        shell: bash
        run: |
          expected="${{ github.sha }}"
          actual="$(git -C "${GITHUB_WORKSPACE}/core/src/modules/PlayerBots" rev-parse HEAD)"
          echo "expected $expected"
          echo "actual   $actual"
          if [ "$actual" != "$expected" ]; then
            echo "::error::Module tree is not the commit under test - FetchContent replaced it."
            git -C "${GITHUB_WORKSPACE}/core/src/modules/PlayerBots" remote -v
            exit 1
          fi

      - name: Build
        run: cmake --build "${RUNNER_TEMP}/build-${{ matrix.version }}" -j "$(nproc)"

      - name: Install
        # Validates the install rules (binaries plus the configured
        # aiplayerbot.conf.dist) like the pre-fork workflow did.
        run: cmake --install "${RUNNER_TEMP}/build-${{ matrix.version }}"
