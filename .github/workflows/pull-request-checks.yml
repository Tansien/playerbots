name: Pull Request Checks

# Why this file exists separately from cmangos-ubuntu-build.yml:
#
# That workflow runs on PERSISTENT SELF-HOSTED runners and therefore deliberately
# has no pull_request trigger - a pull_request run executes the PR's own copy of
# the workflow, which a fork can edit, so a fork PR would get code execution on
# the runner pool. That reasoning is correct and is left untouched.
#
# The consequence, though, was that fork pull requests got NO automated checks at
# all: nothing verified that a contribution even compiles. This workflow closes
# that gap without touching the trust boundary, because it runs on GitHub-hosted
# ephemeral runners:
#   - each job gets a fresh throwaway VM that is destroyed afterwards,
#   - `permissions: contents: read` and GitHub's own fork policy mean a fork PR
#     gets a read-only token and no repository secrets,
#   - so the worst a malicious PR can do is waste its own build minutes.
#
# Scope is deliberately narrow: the Living Realm host tests are plain C++ with no
# core, no DBC and no MySQL, so they configure and run standalone in about a
# minute. Full three-core builds stay on the self-hosted workflow.
#
# NOTE FOR MAINTAINERS: cmangos-ubuntu-build.yml states "No GitHub-hosted runners"
# as fork policy. This file is a deliberate exception to that line, limited to
# untrusted PR validation. If you would rather keep the no-hosted-runners rule
# absolute, delete this file - but then fork PRs remain unverified until a
# maintainer runs workflow_dispatch from a trusted branch.

on:
  pull_request:
    branches:
      - '**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  living-tests:
    name: Living Realm host tests (hosted)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Configure
        run: cmake -DBUILD_PLAYERBOTS_LIVING_TESTS=ON -DCMAKE_BUILD_TYPE=Release -B build-living -S .

      - name: Build
        run: cmake --build build-living -j "$(nproc)"

      - name: Test
        # --no-tests=error: ctest exits 0 with zero registered tests, which would
        # turn a suite that stopped registering into a green check.
        run: ctest --test-dir build-living --output-on-failure --no-tests=error

  living-tests-sanitized:
    name: Living Realm host tests (ASan + UBSan)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Configure
        # -fno-sanitize-recover=undefined makes UBSan findings fail the job instead
        # of printing and continuing. The suite is pure computation, so this costs
        # seconds and catches the overflow/OOB class the module has had before.
        run: >
          cmake -DBUILD_PLAYERBOTS_LIVING_TESTS=ON -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          -B build-asan -S .

      - name: Build
        run: cmake --build build-asan -j "$(nproc)"

      - name: Test
        # LeakSanitizer is on by default when ASan runs on Linux x86_64, and it
        # is deliberately left on so this job's "ASan" name covers the leak
        # class instead of quietly excluding it. 082d764 turned it off only as a
        # sequencing guard - "a separate change that needs its own Linux
        # verification" - and that verification is now done: with the flags
        # above the suite is green at LSan's default (what runs here), while a
        # deliberately leaking test added to this same binary does fail the job,
        # so the detector is live rather than inert.
        env:
          UBSAN_OPTIONS: print_stacktrace=1
        run: ctest --test-dir build-asan --output-on-failure --no-tests=error
